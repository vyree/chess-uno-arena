# MABAR.io game server on Fly.io — PRIMARY since 2026-10-22 (Railway is
# the ?server=railway standby). App renamed chess-uno-arena -> ayo-nge on
# 2026-10-22 at Sensei's request; players reach it via the Firebase
# client at https://fir-pro2-d77c3.web.app (default WS endpoint).
app = "ayo-nge"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
