<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="900" height="900" role="img" aria-label="Ludo Jahat board">
<defs>
<pattern id="stripes-red" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="#ff4d6e"/><line x1="0" y1="0" x2="0" y2="14" stroke="#ffffff" stroke-opacity="0.10" stroke-width="5"/></pattern>
<pattern id="stripes-green" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="#2ed98f"/><line x1="0" y1="0" x2="0" y2="14" stroke="#ffffff" stroke-opacity="0.10" stroke-width="5"/></pattern>
<pattern id="stripes-yellow" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="#ffb81e"/><line x1="0" y1="0" x2="0" y2="14" stroke="#ffffff" stroke-opacity="0.10" stroke-width="5"/></pattern>
<pattern id="stripes-blue" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="#3aa0ff"/><line x1="0" y1="0" x2="0" y2="14" stroke="#ffffff" stroke-opacity="0.10" stroke-width="5"/></pattern>
</defs>

<rect x="0" y="0" width="360" height="360" fill="#0f172a"/>
<g><rect x="0" y="0" width="360" height="360" rx="20" fill="url(#stripes-red)" stroke="#ffffff" stroke-opacity="0.9" stroke-width="4"/><rect x="60" y="60" width="240" height="240" rx="14" fill="#0b1220" stroke="#ff4d6e" stroke-opacity="0.6" stroke-width="2"/><circle cx="120" cy="120" r="28" fill="#0f172a" stroke="#ff4d6e" stroke-width="3"/><circle cx="240" cy="120" r="28" fill="#0f172a" stroke="#ff4d6e" stroke-width="3"/><circle cx="120" cy="240" r="28" fill="#0f172a" stroke="#ff4d6e" stroke-width="3"/><circle cx="240" cy="240" r="28" fill="#0f172a" stroke="#ff4d6e" stroke-width="3"/></g>
</svg>
