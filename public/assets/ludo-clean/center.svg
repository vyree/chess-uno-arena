<g><polygon points="360,360 360,540 450,450" fill="#ff4d6e"/><polygon points="360,360 540,360 450,450" fill="#2ed98f"/><polygon points="540,360 540,540 450,450" fill="#ffb81e"/><polygon points="360,540 540,540 450,450" fill="#3aa0ff"/><circle cx="450" cy="450" r="56" fill="#0f172a" stroke="#ff2e93" stroke-width="3"/><circle cx="450" cy="450" r="44" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="4 5"/></g>
