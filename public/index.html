<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chess + UNO Arena ♟️🃏</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- ============ LANDING ============ -->
  <section id="screen-landing" class="screen">
    <div class="hero">
      <h1>♟️🃏 Chess + UNO Arena</h1>
      <p class="tagline">Main bareng teman — tanpa daftar, tanpa ribet!</p>
    </div>
    <div class="card">
      <label for="nickname">Nickname kamu</label>
      <input id="nickname" maxlength="16" placeholder="cth: Noir" autocomplete="off">
      <div id="nick-error" class="field-error"></div>

      <div class="game-pick">
        <button id="pick-chess" class="game-card selected" data-game="chess">
          <span class="emoji">♟️</span><span>Catur</span><small>2 pemain</small>
        </button>
        <button id="pick-uno" class="game-card" data-game="uno">
          <span class="emoji">🃏</span><span>UNO</span><small>2–6 pemain</small>
        </button>
      </div>

      <button id="btn-create" class="btn primary big">🚪 Buat Room</button>

      <div class="divider"><span>atau</span></div>

      <div class="join-row">
        <input id="room-code" maxlength="6" placeholder="Kode room" autocomplete="off" class="code-input">
        <button id="btn-join" class="btn secondary">Masuk</button>
      </div>
      <div id="join-error" class="field-error"></div>

      <h3>Room yang menunggu</h3>
      <div id="room-list" class="room-list"><p class="muted">Memuat…</p></div>
      <button id="btn-refresh" class="btn ghost small">🔄 Refresh</button>
    </div>
  </section>

  <!-- ============ LOBBY ============ -->
  <section id="screen-lobby" class="screen hidden">
    <div class="card">
      <h2>Lobby Room</h2>
      <div class="room-code-box">
        <span class="muted">Kode room:</span>
        <strong id="lobby-code" class="big-code">------</strong>
        <button id="btn-copy" class="btn ghost small">📋 Salin</button>
      </div>
      <h3>Pemain (<span id="lobby-count">0</span>)</h3>
      <ul id="lobby-players" class="player-list"></ul>
      <div id="chat-box" class="chat-box"></div>
      <div class="chat-row">
        <input id="chat-input" maxlength="200" placeholder="Tulis chat…" autocomplete="off">
        <button id="btn-chat" class="btn secondary">Kirim</button>
      </div>
      <div class="row">
        <button id="btn-start" class="btn primary big">▶️ Mulai Main</button>
        <button id="btn-leave-lobby" class="btn danger">Keluar</button>
      </div>
    </div>
  </section>

  <!-- ============ CHESS ============ -->
  <section id="screen-chess" class="screen hidden">
    <div class="game-bar">
      <div>
        <strong id="chess-opponent">Lawan</strong>
        <span id="chess-turn" class="turn-badge"></span>
      </div>
      <div id="chess-timer" class="timer">⏱️ 60</div>
    </div>
    <div id="chess-status" class="status-line"></div>
    <div id="board" class="board"></div>
    <div class="row">
      <button id="btn-resign" class="btn danger small">🏳️ Menyerah</button>
      <button id="btn-leave-chess" class="btn ghost small">Keluar Room</button>
    </div>
    <div class="card chat-card">
      <div id="chat-box-chess" class="chat-box small"></div>
      <div class="chat-row">
        <input id="chat-input-chess" maxlength="200" placeholder="Chat…" autocomplete="off">
        <button id="btn-chat-chess" class="btn secondary small">Kirim</button>
      </div>
    </div>
  </section>

  <!-- ============ UNO ============ -->
  <section id="screen-uno" class="screen hidden">
    <div class="game-bar">
      <div id="uno-opponents" class="opponents"></div>
      <div id="uno-timer" class="timer">⏱️ 60</div>
    </div>
    <div id="uno-status" class="status-line"></div>
    <div class="uno-table">
      <div id="uno-deck" class="uno-card deck" title="Ambil kartu">🎴<small id="deck-count"></small></div>
      <div id="uno-discard" class="uno-card"></div>
      <div id="uno-color-badge" class="color-badge"></div>
    </div>
    <div class="uno-actions">
      <button id="btn-uno-say" class="btn warning">📢 UNO!</button>
      <button id="btn-uno-pass" class="btn secondary hidden">⏭️ Lewati</button>
    </div>
    <h3>Kartumu (<span id="hand-count">0</span>)</h3>
    <div id="uno-hand" class="uno-hand"></div>
    <div class="row">
      <button id="btn-leave-uno" class="btn ghost small">Keluar Room</button>
    </div>
    <div class="card chat-card">
      <div id="chat-box-uno" class="chat-box small"></div>
      <div class="chat-row">
        <input id="chat-input-uno" maxlength="200" placeholder="Chat…" autocomplete="off">
        <button id="btn-chat-uno" class="btn secondary small">Kirim</button>
      </div>
    </div>
  </section>

</div>

<!-- ============ MODAL ============ -->
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <h2 id="modal-title"></h2>
    <div id="modal-body"></div>
    <div id="modal-actions" class="row"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
