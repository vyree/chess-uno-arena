# FALLBACK image builder (manual dispatch only).
#
# PRIMARY pipeline is now Arona's local build (since 2026-10-22): podman/
# buildah in the sandbox CAN pull base images and build with chroot
# isolation; the image is pushed with flyctl-authenticated registry login:
#   buildah --root ~/workspace/.podman-root --runroot ~/workspace/.podman-runroot \
#     --storage-driver vfs build --isolation chroot \
#     --build-arg NODE_EXTRA_CA_CERTS=/egress-ca.pem \
#     --volume /run/hatch/egress-tls/ca-bundle.pem:/egress-ca.pem:ro \
#     -t registry.fly.io/ayo-nge:latest .
#   flyctl auth token | buildah login registry.fly.io -u x --password-stdin
#   buildah --root ~/workspace/.podman-root --runroot ~/workspace/.podman-runroot \
#     --storage-driver vfs push registry.fly.io/ayo-nge:latest
#   flyctl deploy --image registry.fly.io/ayo-nge:latest -a ayo-nge
#
# This workflow stays as a fallback for when the sandbox route breaks. It
# is dispatch-only so pushes don't fail noisily: the stored FLY_API_TOKEN
# secret predates the ayo-nge app and is scoped to the deleted
# chess-uno-arena app — replace it with an ayo-nge deploy token before
# dispatching, or the registry push fails with "app repository not found".
name: build-image
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: registry.fly.io
          username: x
          password: ${{ secrets.FLY_API_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: registry.fly.io/ayo-nge:latest
