# Builds the game server image and pushes it to Fly.io's registry.
# Exists because Arona's sandbox egress proxy blocks Fly's remote builders
# and Docker Hub CDNs; GitHub's runners have a clean network. Deploy then
# happens from Arona's side with:
#   flyctl deploy --image registry.fly.io/ayo-nge:latest
# Needs one repo secret: FLY_API_TOKEN (a Fly deploy token for this app).
name: build-image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: registry.fly.io
          username: x
          password: ${{ secrets.FLY_API_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: registry.fly.io/ayo-nge:latest
